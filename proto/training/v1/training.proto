syntax = "proto3";

package training.v1;

option go_package = "github.com/jonkmatsumo/label-lag/go/training/proto/trainingv1;trainingv1";

service TrainingService {
  // Clears all data from the database.
  rpc ClearData(ClearDataRequest) returns (ClearDataResponse);

  // Initiates model training.
  rpc Train(TrainRequest) returns (TrainResponse);

  // Fetches metadata for a specific training run.
  rpc GetTrainingRunInfo(GetTrainingRunInfoRequest) returns (GetTrainingRunInfoResponse);

  // Fetches info about the active production model.
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);

  // Validates a training request without executing training.
  rpc ValidateTrainRequest(TrainRequest) returns (ValidateTrainRequestResponse);

  // Lists all registered feature sets.
  rpc ListFeatureSets(ListFeatureSetsRequest) returns (ListFeatureSetsResponse);

  // Starts an asynchronous hyperparameter tuning job.
  rpc StartTuningJob(TrainRequest) returns (StartTuningJobResponse);

  // Checks the status of a tuning job.
  rpc GetTuningStatus(GetTuningStatusRequest) returns (TuningJobStatusResponse);

  // Lists tuning jobs for operator visibility.
  rpc ListTuningJobs(ListTuningJobsRequest) returns (ListTuningJobsResponse);

  // Returns current in-memory queue depth.
  rpc GetQueueDepth(GetQueueDepthRequest) returns (GetQueueDepthResponse);

  // Retrains and registers a model using parameters from a tuning trial.
  rpc PromoteTrial(PromoteTrialRequest) returns (PromoteTrialResponse);

  // Returns a unified tuning job view including summary and trial page.
  rpc GetTuningJobInfo(GetTuningJobInfoRequest) returns (GetTuningJobInfoResponse);

  // Lists trials for a specific tuning job.
  rpc ListTrials(ListTrialsRequest) returns (ListTrialsResponse);

  // Cancels a running tuning job.
  rpc CancelTuningJob(CancelTuningJobRequest) returns (TuningJobStatusResponse);

  // Requeues a terminal tuning job for another execution attempt.
  rpc RequeueTuningJob(RequeueTuningJobRequest) returns (RequeueTuningJobResponse);

  // Force-finalizes a tuning job with an operator-provided reason.
  rpc FinalizeTuningJob(FinalizeTuningJobRequest) returns (FinalizeTuningJobResponse);

  // Fetches health status including spool information.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
}

message ClearDataRequest {
  string tenant_id = 1;
}

message ClearDataResponse {
  bool success = 1;
  repeated string tables_cleared = 2;
}

message TrainRequest {
  int32 max_depth = 1;
  int32 training_window_days = 2;

  // Feature Selection (Precedence: feature_set_id > [selected_feature_columns + feature_groups])
  // Providing both feature_set_id and any other feature field will return INVALID_ARGUMENT.

  // Explicit list of feature names.
  repeated string selected_feature_columns = 3;

  // Versioned feature set identifier.
  optional string feature_set_id = 16;

  // Feature groups to expand (e.g. "transaction", "user", "merchant", "network").
  // Case-insensitive, whitespace is stripped.
  repeated string feature_groups = 17;

  // Resolution mode:
  // "strict" (default): Fail if any feature/group is unknown or group is empty.
  // "best_effort": Drop unknown features/groups and proceed with what's found.
  string feature_resolution_mode = 18;

  SplitConfig split_config = 4;
  TuningConfig tuning_config = 5;
  int32 n_estimators = 6;
  float learning_rate = 7;
  int32 min_child_weight = 8;
  float subsample = 9;
  float colsample_bytree = 10;
  float gamma = 11;
  float reg_alpha = 12;
  float reg_lambda = 13;
  int32 random_state = 14;
  optional int32 early_stopping_rounds = 15;
  string tenant_id = 30;
}

message SplitConfig {
  string strategy = 1; // temporal, temporal_stratified, etc.
  int32 n_folds = 2;
  optional string stratify_column = 3;
  string group_column = 4;
  float validation_fraction = 5;
  int32 seed = 6;
}

message TuningConfig {
  bool enabled = 1;
  string strategy = 2; // grid, random, bayesian
  int32 n_trials = 3;
  int32 timeout_minutes = 4;
  string metric = 5;
  string direction = 6; // maximize, minimize
  optional int32 selected_trial_number = 7;
  map<string, string> search_space = 8; // JSON-encoded range, e.g. "[2, 12]"
}

message TrainResponse {
  bool success = 1;
  string run_id = 2;
  string status = 3;
  string model_version = 4;
  string error = 5;
  string tenant_id = 6;
}

message GetTrainingRunInfoRequest {
  string run_id = 1;
  string tenant_id = 2;
}

message GetTrainingRunInfoResponse {
  // JSON-serialized TrainingRunSpec
  string run_spec_json = 1;
}

message GetModelInfoRequest {
  // Optional: model name, defaults to production if empty.
  string model_name = 1;
  string tenant_id = 2;
}

message GetModelInfoResponse {
  string model_name = 1;
  string model_version = 2;
  repeated string required_features = 3;
  string feature_set_hash = 4;
  string training_config_hash = 5;
  string run_id = 6;
}

message ValidateTrainRequestResponse {
  bool valid = 1;
  repeated string resolved_features = 2;
  string feature_set_hash = 3;
  string training_config_hash = 4;
  repeated string warnings = 5;
}

message ListFeatureSetsRequest {
  int32 limit = 1;
  string cursor = 2;
  string tenant_id = 3;
}

message ListFeatureSetsResponse {
  message FeatureSetSummary {
    string id = 1;
    string hash = 2;
    int32 feature_count = 3;
    string created_at = 4;
    string created_by = 5;
  }
  repeated FeatureSetSummary feature_sets = 1;
  string next_cursor = 2;
}

message StartTuningJobResponse {
  string job_id = 1;
  string status = 2;
  string mlflow_run_id = 3;
}

message GetTuningStatusRequest {
  string job_id = 1;
  string tenant_id = 2;
}

message TuningJobStatusResponse {
  string job_id = 1;
  string status = 2;
  int32 completed_trials = 3;
  int32 total_trials = 4;
  int32 pruned_trials = 5;
  float best_value = 6;
  map<string, string> best_params = 7;
  string mlflow_run_id = 8;
  string error_message = 9;
  int64 created_at = 10;
  int64 started_at = 11;
  int64 updated_at = 12;
  int64 ended_at = 13;
  int64 heartbeat_at = 14;
}

message ListTuningJobsRequest {
  repeated string statuses = 1;
  int32 limit = 2;
  string cursor = 3;
}

message TuningJobSummary {
  string job_id = 1;
  string status = 2;
  int64 created_at = 3;
  int64 started_at = 4;
  int64 updated_at = 5;
  int64 ended_at = 6;
  string mlflow_run_id = 7;
  int32 total_trials = 8;
  int32 completed_trials = 9;
  int32 pruned_trials = 10;
  optional float best_value = 11;
  string metric = 12;
  string direction = 13;
  optional string requested_by = 14;
  optional string error_message = 15;
}

message ListTuningJobsResponse {
  repeated TuningJobSummary jobs = 1;
  string next_cursor = 2;
}

message GetQueueDepthRequest {}

message GetQueueDepthResponse {
  int32 depth = 1;
}

message PromoteTrialRequest {
  string job_id = 1;
  int32 trial_number = 2;
  string model_name = 3;
  bool dry_run = 4;
  string tenant_id = 5;
}

message PromoteTrialResponse {
  string status = 1;
  string mlflow_run_id = 2;
  string model_version = 3;
  string error_message = 4;
}

message GetTuningJobInfoRequest {
  string job_id = 1;
  int32 trials_limit = 2;
  string trials_cursor = 3;
  string sort_by = 4;
  string tenant_id = 5;
}

message TrialResult {
  int32 trial_number = 1;
  string state = 2;
  float value = 3;
  map<string, string> params = 4;
  int64 started_at = 5;
  int64 ended_at = 6;
  float duration_ms = 7;
}

message GetTuningJobInfoResponse {
  TuningJobSummary job = 1;
  repeated TrialResult trials = 2;
  string next_cursor = 3;
  map<string, string> mlflow_links = 4;
}

message ListTrialsRequest {
  string job_id = 1;
  int32 limit = 2;
  string sort_by = 3; // "value" or "trial_number"
  string tenant_id = 4;
  string cursor = 5;
}

message TrialRecord {
  int32 trial_number = 1;
  string state = 2;
  float value = 3;
  map<string, string> params = 4;
  int64 started_at = 5;
  int64 ended_at = 6;
  float duration_ms = 7;
}

message ListTrialsResponse {
  repeated TrialRecord trials = 1;
  string next_cursor = 2;
}

message CancelTuningJobRequest {
  string job_id = 1;
  string tenant_id = 2;
}

message RequeueTuningJobRequest {
  string job_id = 1;
  string tenant_id = 2;
}

message RequeueTuningJobResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
}

message FinalizeTuningJobRequest {
  string job_id = 1;
  string final_status = 2;
  string reason = 3;
  string tenant_id = 4;
}

message FinalizeTuningJobResponse {
  string job_id = 1;
  string status = 2;
  string error_message = 3;
}

message GetHealthRequest {}

message GetHealthResponse {
  bool ready = 1;
  map<string, string> components = 2;
  int32 spooled_reports_count = 3;
}
