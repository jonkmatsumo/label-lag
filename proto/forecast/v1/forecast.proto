syntax = "proto3";

package forecast.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jonkmatsumo/label-lag/go/forecast/proto/forecastv1;forecastv1";

service ForecastService {
  // Retrieves health status of the service.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // Retrieves drift monitoring metrics.
  rpc GetDriftMonitoring(GetDriftMonitoringRequest) returns (GetDriftMonitoringResponse);

  // Retrieves score distribution for monitoring.
  rpc GetScoreDistribution(GetScoreDistributionRequest) returns (GetScoreDistributionResponse);

  // Reloads the production model from the model registry.
  rpc ReloadModel(ReloadModelRequest) returns (ReloadModelResponse);

  // Deploys a specific model version to production.
  rpc DeployModel(DeployModelRequest) returns (DeployModelResponse);

  // Predicts fraud risk only (no rules).
  rpc PredictSignal(PredictSignalRequest) returns (PredictSignalResponse);
}

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;
  map<string, string> components = 2;
}

message GetDriftMonitoringRequest {
  int32 hours = 1;
  double threshold = 2;
  bool force_refresh = 3;
}

message GetDriftMonitoringResponse {
  bool drift_detected = 1;
  double drift_score = 2;
  google.protobuf.Struct metrics = 3;
}

message GetScoreDistributionRequest {
  int32 hours = 1;
}

message GetScoreDistributionResponse {
  repeated int32 scores = 1;
  map<string, int32> distribution = 2;
  double divergence = 3;
  string divergence_metric = 4;
  bool shift_detected = 5;
}

message ReloadModelRequest {}

message ReloadModelResponse {
  bool success = 1;
  string model_version = 2;
}

message DeployModelRequest {
  string model_version = 1;
  string stage = 2; // e.g., "Production", "Staging"
  string actor = 3;
  string reason = 4;
}

message DeployModelResponse {
  bool success = 1;
  string message = 2;
  string model_version = 3;
  string deployed_at = 4;
}

message PredictSignalRequest {
  string user_id = 1;
  double amount = 2;
  string currency = 3;
  string client_transaction_id = 4;
}

message PredictSignalResponse {
  double probability = 1;
  string model_version = 2;
  string run_id = 3;
}
