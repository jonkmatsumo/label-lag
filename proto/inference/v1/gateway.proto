syntax = "proto3";

package gateway.v1;

option go_package = "github.com/jonkmatsumo/label-lag/go/orchestrator/internal/http/gatewayv1;gatewayv1";

import "google/protobuf/struct.proto";
import "analytics/v1/analytics.proto";

service GatewayService {
  // Evaluates a set of rules against provided features.
  rpc EvaluateRules(EvaluateRulesRequest) returns (EvaluateRulesResponse);

  // Compares two rulesets against provided features.
  rpc EvaluateRulesDiff(EvaluateRulesDiffRequest) returns (EvaluateRulesDiffResponse);

  // Reloads rules from configured providers.
  rpc ReloadRules(ReloadRulesRequest) returns (ReloadRulesResponse);

  // Explains the evaluation of a set of rules against provided features.
  rpc ExplainEvaluation(ExplainEvaluationRequest) returns (ExplainEvaluationResponse);
}

message EvaluateRulesRequest {
  google.protobuf.Struct features = 1; // Flexible map for feature hydration
  int32 base_score = 2;
  RuleSet ruleset = 3; // Optional, if not provided uses default
  bool shadow_mode = 4;
}

message EvaluateRulesResponse {
  int32 final_score = 1;
  int32 baseline_score = 2;
  int32 shadow_score = 3; // Only if shadow_mode=true
  repeated string matched_rules = 4;
  repeated Explanation explanations = 5;
  repeated string shadow_matched_rules = 6;
  repeated Explanation shadow_explanations = 7;
  bool rejected = 8;
  string ruleset_version = 9;
  repeated Conflict warnings = 10;
  double evaluation_time_ms = 11;
}

message EvaluateRulesDiffRequest {
  google.protobuf.Struct features = 1;
  int32 base_score = 2;
  RuleSet ruleset_a = 3;
  RuleSet ruleset_b = 4;
  bool shadow_mode = 5;
}

message EvaluateRulesDiffResponse {
  EvaluateRulesResponse a = 1;
  EvaluateRulesResponse b = 2;
  RulesDiffSummary diff = 3;
  double total_evaluation_time_ms = 4;
}

message RulesDiffSummary {
  string severity = 1;
  int32 score_delta = 2;
  repeated string matched_rules_added = 3;
  repeated string matched_rules_removed = 4;
}

message RuleSet {
    repeated crud.v1.Rule rules = 1;
}

message Explanation {
    string rule_id = 1;
    string severity = 2;
    string reason = 3;
    string action = 4;
    int32 score = 5;
    string explanation = 6;
    int32 score_delta = 7;
}

message Conflict {
  string message = 1;
}

message ReloadRulesRequest {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    FILE_PROVIDER = 1;
    API_PROVIDER = 2;
    BOTH = 3;
  }
  Source source = 1;
  string reason = 2;
}

message ReloadRulesResponse {
  bool success = 1;
  string rules_version = 2;
  repeated ReloadRulesRequest.Source reloaded_sources = 3;
  int64 duration_ms = 4;
  string message = 5;
}

message ExplainEvaluationRequest {
  google.protobuf.Struct features = 1;
  RuleSet ruleset = 2;
  int32 max_rules = 3; // Default 50 if 0
  bool include_values = 4; // Default false
}

message ExplainEvaluationResponse {
  double eval_time_ms = 1;
  int32 matched_count = 2;
  string rules_version = 3;
  repeated RuleTrace traces = 4;
}

message RuleTrace {
  string rule_id = 1;
  bool matched = 2;
  double eval_time_ms = 3;
  repeated ConditionTrace conditions = 4;
}

message ConditionTrace {
  string field = 1;
  string operator = 2;
  string expected_type = 3;
  string actual_type = 4;
  bool result = 5;
  string actual_value_redacted = 6; // Only if include_values=true and safe
}
