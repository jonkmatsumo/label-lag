syntax = "proto3";

package crud.v1;

option go_package = "github.com/jonkmatsumo/label-lag/go/analytics/proto/crud/v1;crudv1";

import "google/protobuf/timestamp.proto";
import "common/v1/pagination.proto";

service AnalyticsService {
  rpc GetDailyStats(GetDailyStatsRequest) returns (GetDailyStatsResponse);
  rpc GetTransactionDetails(GetTransactionDetailsRequest) returns (GetTransactionDetailsResponse);
  rpc SearchTransactions(SearchTransactionsRequest) returns (SearchTransactionsResponse);
  rpc GetRecentAlerts(GetRecentAlertsRequest) returns (GetRecentAlertsResponse);
  rpc GetOverviewMetrics(GetOverviewMetricsRequest) returns (GetOverviewMetricsResponse);

  rpc GetFeatureSample(GetFeatureSampleRequest) returns (GetFeatureSampleResponse);

  rpc GetTrainingData(GetTrainingDataRequest) returns (GetTrainingDataResponse);
  rpc GetBacktestFeatures(GetBacktestFeaturesRequest) returns (GetBacktestFeaturesResponse);
  rpc SaveBacktestResult(SaveBacktestResultRequest) returns (SaveBacktestResultResponse);
  rpc ListBacktestResults(ListBacktestResultsRequest) returns (ListBacktestResultsResponse);
  rpc GetBacktestResult(GetBacktestResultRequest) returns (GetBacktestResultResponse);
  rpc GetDriftWindow(GetDriftWindowRequest) returns (GetDriftWindowResponse);
  rpc StoreGeneratedData(StoreGeneratedDataRequest) returns (StoreGeneratedDataResponse);
  rpc ClearAllData(ClearAllDataRequest) returns (ClearAllDataResponse);
  rpc MaterializeFeatures(MaterializeFeaturesRequest) returns (MaterializeFeaturesResponse);

  // Synthetic Data Generation (Go implementation)
  rpc GenerateData(GenerateDataRequest) returns (GenerateDataResponse);

  // Score Monitoring (C3)
  rpc GetInferenceScores(GetInferenceScoresRequest) returns (GetInferenceScoresResponse);

  // Rule Management
  rpc SaveRule(SaveRuleRequest) returns (SaveRuleResponse);
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);

  // Rule Versioning & Control Plane
  rpc ListRuleVersions(ListRuleVersionsRequest) returns (ListRuleVersionsResponse);
  rpc GetRuleVersion(GetRuleVersionRequest) returns (GetRuleVersionResponse);
  rpc PublishRuleVersion(PublishRuleVersionRequest) returns (PublishRuleVersionResponse);
  rpc GetRuleReadiness(GetRuleReadinessRequest) returns (GetRuleReadinessResponse);
  rpc DiffRuleVersions(DiffRuleVersionsRequest) returns (DiffRuleVersionsResponse);
  rpc GetRuleStats(GetRuleStatsRequest) returns (GetRuleStatsResponse);
  rpc GetAttribution(GetAttributionRequest) returns (GetAttributionResponse);

  // Inference Events
  rpc LogInferenceEvent(LogInferenceEventRequest) returns (LogInferenceEventResponse);

  // Feature Hydration (Phase 6)
  rpc GetLatestUserFeatures(GetLatestUserFeaturesRequest) returns (GetLatestUserFeaturesResponse);
  rpc BatchGetLatestUserFeatures(BatchGetLatestUserFeaturesRequest) returns (BatchGetLatestUserFeaturesResponse);

  // Backtest Compare (Phase 8)
  rpc CompareBacktests(CompareBacktestsRequest) returns (CompareBacktestsResponse);

  // Shadow Comparison (Phase 9)
  rpc GetShadowComparison(GetShadowComparisonRequest) returns (GetShadowComparisonResponse);

  // Dataset Profiling (Proposal B)
  rpc GetDatasetProfile(GetDatasetProfileRequest) returns (GetDatasetProfileResponse);

  // Decision Explorer (Phase 2)
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse);
  rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse);
  rpc GetDecisionTrace(GetDecisionTraceRequest) returns (GetDecisionTraceResponse);

  // Rule Impact (Phase 2)
  rpc GetRuleImpact(GetRuleImpactRequest) returns (GetRuleImpactResponse);

  // Dashboard Aggregates (Phase 3)
  rpc GetKpis(GetKpisRequest) returns (GetKpisResponse);
  rpc GetVolumeSeries(GetVolumeSeriesRequest) returns (GetVolumeSeriesResponse);

  // Model Performance (Phase 3 Fast-follow)
  rpc GetConfusionMatrix(GetConfusionMatrixRequest) returns (GetConfusionMatrixResponse);

  // Jobs & Job Events (Phase A1)
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc GetJobEvents(GetJobEventsRequest) returns (GetJobEventsResponse);
  rpc GetJobSummary(GetJobSummaryRequest) returns (GetJobSummaryResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);

  // Dataset Profiles (Phase A2)
  rpc GetDatasetSummary(GetDatasetSummaryRequest) returns (GetDatasetSummaryResponse);
  rpc ListDatasetProfiles(ListDatasetProfilesRequest) returns (ListDatasetProfilesResponse);
  rpc GetLatestDatasetProfile(GetLatestDatasetProfileRequest) returns (GetLatestDatasetProfileResponse);
  rpc CompareDatasetProfiles(CompareDatasetProfilesRequest) returns (CompareDatasetProfilesResponse);

  // Training Runs (Phase B)
  rpc ListTrainingRuns(ListTrainingRunsRequest) returns (ListTrainingRunsResponse);
  rpc GetTrainingRun(GetTrainingRunRequest) returns (GetTrainingRunResponse);
  rpc ListModelVersions(ListModelVersionsRequest) returns (ListModelVersionsResponse);
  rpc GetMetricSeries(GetMetricSeriesRequest) returns (GetMetricSeriesResponse);
  rpc ReportTrainingRun(ReportTrainingRunRequest) returns (ReportTrainingRunResponse);
}

message AnalyticsQueryEnvelope {
  string start_time = 1;  // RFC3339
  string end_time = 2;  // RFC3339
  string granularity = 3;  // "hour" | "day"
}

message GetKpisRequest {
  google.protobuf.Timestamp start_time = 1 [deprecated = true];
  google.protobuf.Timestamp end_time = 2 [deprecated = true];
  string group_by = 3 [deprecated = true]; // "hour" | "day"
  string tenant_id = 15;
  AnalyticsQueryEnvelope query = 16;
}

message KpiBucket {
  google.protobuf.Timestamp timestamp = 1;
  int64 total_decisions = 2;
  int64 total_alerts = 3;
  double avg_score = 4;
}

message GetKpisResponse {
  int64 total_decisions = 1;
  int64 total_alerts = 2;
  double alert_rate = 3;
  double avg_score = 4;
  int64 rules_fired_total = 5;
  repeated KpiBucket buckets = 6;
}

message GetVolumeSeriesRequest {
  google.protobuf.Timestamp start_time = 1 [deprecated = true];
  google.protobuf.Timestamp end_time = 2 [deprecated = true];
  string granularity = 3 [deprecated = true]; // "hour" | "day"
  string tenant_id = 15;
  AnalyticsQueryEnvelope query = 16;
}

message VolumePoint {
  google.protobuf.Timestamp timestamp = 1;
  int64 count = 2;
  int64 alerts = 3;
}

message GetVolumeSeriesResponse {
  repeated VolumePoint points = 1;
}

message GetConfusionMatrixRequest {
  google.protobuf.Timestamp start_time = 1 [deprecated = true];
  google.protobuf.Timestamp end_time = 2 [deprecated = true];
  string model_version = 3;
  int32 threshold = 4; // Optional: custom score threshold
  string tenant_id = 15;
  AnalyticsQueryEnvelope query = 16;
}

message GetConfusionMatrixResponse {
  int64 true_positives = 1;
  int64 false_positives = 2;
  int64 true_negatives = 3;
  int64 false_negatives = 4;
  double precision = 5;
  double recall = 6;
  double f1_score = 7;
  bool insufficient_labels = 8;
}

message GetDatasetProfileRequest {
  string dataset_id = 1; // can be run_id or name
  int32 limit_features = 2; // default server-side if 0
  int32 num_buckets = 3; // default 10
}

message Bucket {
  double lower = 1;
  double upper = 2;
  int64 count = 3;
}

message FeatureProfile {
  string name = 1;
  string type = 2; // "numeric" | "categorical"
  double null_rate = 3;
  // Numeric stats
  double mean = 4;
  double std_dev = 5;
  repeated Bucket histogram = 6;
  // Categorical stats
  repeated ValueCount top_values = 7;
}

message ValueCount {
  string value = 1;
  int64 count = 2;
}

message GetDatasetProfileResponse {
  int64 total_records = 1;
  repeated FeatureProfile feature_profiles = 2;
  bool is_partial = 3;
  int32 truncated_keys = 4;
}

message GetDailyStatsRequest {
  int32 days = 1;
  string tenant_id = 15;
}

message DailyStat {
  string date = 1; // YYYY-MM-DD
  int64 total_transactions = 2;
  int64 fraud_count = 3;
  double fraud_rate = 4;
  double total_amount = 5;
  double avg_z_score = 6;
}

message GetDailyStatsResponse {
  repeated DailyStat stats = 1;
}

message GetTransactionDetailsRequest {
  int32 days = 1;
  int32 limit = 2;
  int32 offset = 3;
  string tenant_id = 15;
}

message TransactionDetail {
  string record_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  bool is_train_eligible = 4;
  bool is_pre_fraud = 5;
  double amount = 6;
  bool is_fraudulent = 7;
  string fraud_type = 8;
  bool is_off_hours_txn = 9;
  int32 merchant_risk_score = 10;
  int32 velocity_24h = 11;
  double amount_to_avg_ratio_30d = 12;
  double balance_volatility_z_score = 13;

  // Dynamic features
  map<string, double> numerical_features = 100;
  map<string, string> categorical_features = 101;
}

message GetTransactionDetailsResponse {
  repeated TransactionDetail transactions = 1;
}

message SearchTransactionsRequest {
  string user_id = 1;
  string transaction_id = 2;
  string start_date = 3;
  string end_date = 4;
  optional double min_amount = 5;
  optional double max_amount = 6;
  optional bool is_fraudulent = 7;
  optional int32 min_score = 8;
  optional int32 max_score = 9;
  int32 limit = 10;
  common.v1.CursorPageRequest pagination = 16;
  string cursor = 17;
  bool include_features = 12; // Exclude heavy features if false
  string tenant_id = 15;
}

message SearchTransactionsResponse {
  repeated TransactionDetail transactions = 1;
  common.v1.CursorPageResponse pagination = 3;
  bool truncated = 4;
  string next_cursor = 5;
}

message GetRecentAlertsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string tenant_id = 15;
}

message Alert {
  string record_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  double amount = 4;
  bool is_fraudulent = 5;
  string fraud_type = 6;
  int32 merchant_risk_score = 7;
  int32 velocity_24h = 8;
  double amount_to_avg_ratio_30d = 9;
  double balance_volatility_z_score = 10;
  int32 computed_risk_score = 11;
}

message GetRecentAlertsResponse {
  repeated Alert alerts = 1;
}

message GetOverviewMetricsRequest {
  string tenant_id = 15;
}

message GetOverviewMetricsResponse {
  int64 total_records = 1;
  int64 fraud_records = 2;
  double fraud_rate = 3;
  int64 unique_users = 4;
  google.protobuf.Timestamp min_transaction_timestamp = 5;
  google.protobuf.Timestamp max_transaction_timestamp = 6;
  google.protobuf.Timestamp min_created_at = 7;
  google.protobuf.Timestamp max_created_at = 8;
  double total_amount = 9;
  double fraud_amount = 10;
}



message GetFeatureSampleRequest {
  int32 sample_size = 1;
  bool stratify = 2;
  string tenant_id = 15;
}

message FeatureSample {
  string record_id = 1;
  bool is_fraudulent = 2;
  double velocity_24h = 3;
  double amount_to_avg_ratio_30d = 4;
  double balance_volatility_z_score = 5;
}

message GetFeatureSampleResponse {
  repeated FeatureSample samples = 1;
}



message GetTrainingDataRequest {
  google.protobuf.Timestamp cutoff_date = 1;
  string tenant_id = 15;
}

message GetTrainingDataResponse {
  repeated TransactionDetail train_records = 1;
  repeated TransactionDetail test_records = 2;
}

message GetBacktestFeaturesRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string tenant_id = 15;
}

message BacktestFeatureVector {
  string record_id = 1;
  int32 velocity_24h = 2;
  double amount_to_avg_ratio_30d = 3;
  double balance_volatility_z_score = 4;
  string experimental_signals_json = 5;
}

message GetBacktestFeaturesResponse {
  repeated BacktestFeatureVector features = 1;
}

message BacktestMetrics {
  int64 total_records = 1;
  int64 matched_count = 2;
  double match_rate = 3;
  map<string, int32> score_distribution = 4;
  double score_mean = 5;
  double score_std = 6;
  int32 score_min = 7;
  int32 score_max = 8;
  int64 rejected_count = 9;
  double rejected_rate = 10;
}

message BacktestResult {
  string job_id = 1;
  string rule_id = 2;
  string ruleset_version = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  BacktestMetrics metrics = 6;
  google.protobuf.Timestamp completed_at = 7;
  string error = 8;
}

message SaveBacktestResultRequest {
  BacktestResult result = 1;
}

message SaveBacktestResultResponse {
  bool success = 1;
}

message ListDatasetProfilesRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  int32 limit = 3;
  int32 offset = 4;
  string tenant_id = 15;
  common.v1.CursorPageRequest pagination = 16;
}

message ListBacktestResultsRequest {
  string rule_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  int32 limit = 4;
  int32 offset = 5;
  string tenant_id = 15;
}

message ListBacktestResultsResponse {
  repeated BacktestResult results = 1;
}

message GetBacktestResultRequest {
  string job_id = 1;
}

message GetBacktestResultResponse {
  BacktestResult result = 1;
}

message GetDriftWindowRequest {
  int32 hours = 1;
  string tenant_id = 15;
}

message GetDriftWindowResponse {
  repeated TransactionDetail transactions = 1;
}

message GetInferenceScoresRequest {
  int32 hours = 1;
  string tenant_id = 15;
}

message GetInferenceScoresResponse {
  repeated int32 scores = 1;
}

message StoreGeneratedDataRequest {
  repeated GeneratedRecord records = 1;
  repeated EvaluationMetadata metadata = 2;
}

// GeneratedRecord represents a synthetic transaction record.
// FROZEN: This message is under contract freeze for Python-to-Go migration.
// Do not add, remove, or renumber fields without coordinating with both implementations.
message GeneratedRecord {
  string record_id = 1;
  string user_id = 2;
  string full_name = 3;
  string email = 4;
  string phone = 5;
  google.protobuf.Timestamp transaction_timestamp = 6;
  bool is_off_hours_txn = 7;
  double available_balance = 8;
  double balance_to_transaction_ratio = 9;
  double avg_available_balance_30d = 10;
  double balance_volatility_z_score = 11;
  int32 bank_connections_count_24h = 12;
  int32 bank_connections_count_7d = 13;
  double bank_connections_avg_30d = 14;
  double amount = 15;
  double amount_to_avg_ratio = 16;
  int32 merchant_risk_score = 17;
  bool is_returned = 18;
  google.protobuf.Timestamp email_changed_at = 19;
  google.protobuf.Timestamp phone_changed_at = 20;
  bool is_fraudulent = 21;
  string fraud_type = 22;

  // Dynamic features
  map<string, double> numerical_features = 100;
  map<string, string> categorical_features = 101;
}

// EvaluationMetadata tracks temporal relationships for model evaluation.
// FROZEN: This message is under contract freeze for Python-to-Go migration.
// Do not add, remove, or renumber fields without coordinating with both implementations.
message EvaluationMetadata {
  string user_id = 1;
  string record_id = 2;
  int32 sequence_number = 3;
  google.protobuf.Timestamp fraud_confirmed_at = 4;
  bool is_pre_fraud = 5;
  int32 days_to_fraud = 6;
  bool is_train_eligible = 7;
}

message StoreGeneratedDataResponse {
  bool success = 1;
  int64 records_saved = 2;
}

message ClearAllDataRequest {
  string tenant_id = 1;
}
message ClearAllDataResponse {
  bool success = 1;
  repeated string tables_cleared = 2;
}

message MaterializeFeaturesRequest {
  int32 batch_size = 1;
}

message MaterializeFeaturesResponse {
  bool success = 1;
  int64 total_processed = 2;
}

// GenerateDataRequest initiates synthetic data generation in Go.
// This is an alternative to the Python /data/generate endpoint.
message GenerateDataRequest {
  int32 num_users = 1;      // Number of users to generate
  double fraud_rate = 2;    // Fraction of fraudulent users (0.0 to 1.0)
  bool drop_existing = 3;   // Clear existing data before generating
  optional int64 seed = 4;  // Optional seed for deterministic generation
  string idempotency_key = 5; // Prevent duplicate generation
}

message GenerateDataResponse {
  bool success = 1;
  int64 total_records = 2;       // Total records generated
  int64 fraud_records = 3;       // Number of fraud records
  int64 features_materialized = 4; // Number of feature rows materialized
  string error = 5;              // Error message if !success
}

message Rule {
  string id = 1;
  string field = 2;
  string op = 3;
  string value_json = 4;
  string action = 5;
  int32 score = 6;
  string severity = 7;
  string reason = 8;
  string status = 9;
}

message SaveRuleRequest {
  Rule rule = 1;
  string tenant_id = 2;
}

message SaveRuleResponse {
  bool success = 1;
}

message GetRuleRequest {
  string rule_id = 1;
  string tenant_id = 2;
}

message GetRuleResponse {
  Rule rule = 1;
}

message ListRulesRequest {
  string status = 1;
  bool include_archived = 2;
  string tenant_id = 3;
}

message ListRulesResponse {
  repeated Rule rules = 1;
}

message DeleteRuleRequest {
  string rule_id = 1;
  string tenant_id = 2;
}

message DeleteRuleResponse {
  bool success = 1;
}

message RuleImpact {
  string rule_id = 1;
  bool is_shadow = 2;
  double score_delta = 3;
}

message InferenceEvent {
  string request_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string model_version = 3;
  string rules_version = 4;
  int32 model_score = 5;
  int32 final_score = 6;
  repeated RuleImpact rule_impacts = 7;
  string user_id = 8;
  string decision = 9;
  string decision_reason = 10;
  DecisionThresholds thresholds = 11;
  string tenant_id = 12;
}

message DecisionThresholds {
  int32 approve_max = 1;
  int32 review_max = 2;
}

message LogInferenceEventRequest {
  InferenceEvent event = 1;
}

message LogInferenceEventResponse {
  bool success = 1;
}

message ListRuleVersionsRequest {
  string rule_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string tenant_id = 4;
}

message ListRuleVersionsResponse {
  repeated Rule versions = 1;
  int64 total = 2;
}

message GetRuleVersionRequest {
  string rule_id = 1;
  string version_id = 2; // "latest", "active", or specific version
  string tenant_id = 3;
}

message GetRuleVersionResponse {
  Rule rule = 1;
  string version_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

message PublishRuleVersionRequest {
  string rule_id = 1;
  string version_id = 2; // Optional: specific version to promote. If empty, promote draft.
  string actor = 3;
  string reason = 4;
  string tenant_id = 5;
}

message PublishRuleVersionResponse {
  bool success = 1;
  string active_version_id = 2;
}

message GetRuleReadinessRequest {
  string rule_id = 1;
  string tenant_id = 2;
}

enum ReadinessStatus {
  READINESS_STATUS_UNSPECIFIED = 0;
  READINESS_STATUS_PASS = 1;
  READINESS_STATUS_WARN = 2;
  READINESS_STATUS_FAIL = 3;
}

message ReadinessCheck {
  string name = 1;
  bool passed = 2;
  string message = 3;
  ReadinessStatus status = 4;
}

message GetRuleReadinessResponse {
  string rule_id = 1;
  bool ready = 2;
  repeated ReadinessCheck checks = 3;
  ReadinessStatus overall_status = 4;
}

message DiffRuleVersionsRequest {
  string rule_id = 1;
  string version_a = 2;
  string version_b = 3;
  string tenant_id = 4;
}

message RuleDiffChange {
  string field_name = 1;
  string before_value = 2; // JSON string
  string after_value = 3; // JSON string
  string description = 4;
  string change_type = 5; // e.g. "modified"
}

message DiffRuleVersionsResponse {
  string rule_id = 1;
  string version_a = 2;
  string version_b = 3;
  repeated RuleDiffChange changes = 4;
  bool is_breaking = 5;
}

message GetRuleStatsRequest {
  string rule_id = 1; // Optional, if empty returns all
  int32 days = 2;
  string tenant_id = 15;
}

message RuleStats {
  string rule_id = 1;
  int64 triggered_count = 2;
  int64 shadow_triggered_count = 3;
  double approval_rate = 4;
}

message GetRuleStatsResponse {
  repeated RuleStats stats = 1;
}

message GetAttributionRequest {
  int32 days = 1;
  int32 limit = 2;
  string tenant_id = 15;
}

message DailyAttribution {
  string date = 1;
  string rule_id = 2;
  int64 contribution_score = 3; // Total score contributed
  int64 volume = 4;
}

message ListDecisionsRequest {
  string user_id = 1;
  string decision = 2;
  int32 min_score = 3;
  int32 max_score = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  int32 limit = 7;
  int32 offset = 8;
  string tenant_id = 15;
  common.v1.CursorPageRequest pagination = 16;
}

message ListDecisionsResponse {
  repeated DecisionSummary decisions = 1;
  common.v1.CursorPageResponse pagination = 2;
}

message DecisionSummary {
  string request_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  int32 final_score = 4;
  string decision = 5;
  string decision_reason = 6;
  DecisionThresholds thresholds = 7;
}

message GetDecisionRequest {
  string request_id = 1;
  string tenant_id = 2;
}

message GetDecisionResponse {
  InferenceEvent decision = 1;
}

message GetDecisionTraceRequest {
  string request_id = 1;
  string tenant_id = 2;
}

message GetDecisionTraceResponse {
  repeated RuleImpact trace = 1;
}

message GetRuleImpactRequest {
  string rule_id = 1;
  google.protobuf.Timestamp start_date = 2 [deprecated = true];
  google.protobuf.Timestamp end_date = 3 [deprecated = true];
  string tenant_id = 15;
  AnalyticsQueryEnvelope query = 16;
}

message RuleImpactBucket {
  string date = 1;
  int64 trigger_count = 2;
  double avg_score_delta = 3;
  int64 decisions_changed_count = 4;
}

message GetRuleImpactResponse {
  string rule_id = 1;
  int64 total_triggers = 2;
  double avg_score_delta = 3;
  repeated RuleImpactBucket daily_buckets = 4;
}

message GetAttributionResponse {
  repeated DailyAttribution items = 1;
}

// Feature Hydration (Phase 6)
message UserFeatures {
  string user_id = 1;
  string snapshot_id = 2;
  google.protobuf.Timestamp snapshot_timestamp = 3;
  int32 velocity_24h = 4;
  double amount_to_avg_ratio_30d = 5;
  double balance_volatility_z_score = 6;
  int32 bank_connections_24h = 7;
  int32 merchant_risk_score = 8;
  bool has_history = 9;
}

message GetLatestUserFeaturesRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message GetLatestUserFeaturesResponse {
  UserFeatures features = 1;
  bool found = 2;
}

message BatchGetLatestUserFeaturesRequest {
  repeated string user_ids = 1;
  string tenant_id = 2;
}

message BatchGetLatestUserFeaturesResponse {
  map<string, UserFeatures> features = 1;
}


// Backtest Compare (Phase 8)
message CompareBacktestsRequest {
  string baseline_job_id = 1;
  string candidate_job_id = 2;
  string tenant_id = 3;
}

message BacktestMetricsDelta {
  double match_rate_delta = 1;       // candidate - baseline
  double score_mean_delta = 2;
  double score_std_delta = 3;
  double rejected_rate_delta = 4;
  int64 total_records_delta = 5;
  int64 matched_count_delta = 6;
}

message CompareBacktestsResponse {
  BacktestResult baseline = 1;
  BacktestResult candidate = 2;
  BacktestMetricsDelta delta = 3;
}

// Shadow Comparison (Phase 9)
message GetShadowComparisonRequest {
  int32 hours = 1;
  string tenant_id = 15;
}

message ShadowModeMetrics {
    int64 total_evaluations = 1;
    int64 divergent_scores_count = 2; // how many times shadow score != final_score
    double divergent_rate = 3;
    double active_score_mean = 4;
    double shadow_score_mean = 5;
    map<string, int32> active_score_distribution = 6;
    map<string, int32> shadow_score_distribution = 7;
}

message GetShadowComparisonResponse {
    ShadowModeMetrics metrics = 1;
}

message Job {
  string job_id = 1;
  string job_type = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  string error_code = 7;
  string error_message = 8;
  string params_json = 9;
  string metrics_json = 10;
}

message JobEvent {
  int64 event_id = 1;
  string job_id = 2;
  string event_type = 3;
  google.protobuf.Timestamp timestamp = 4;
  string details_json = 5;
}

message ListJobsRequest {
  string job_type = 1;
  string status = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  int32 limit = 5;
  int32 offset = 6;
  string tenant_id = 15;
  common.v1.CursorPageRequest pagination = 16;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  common.v1.CursorPageResponse pagination = 2;
}

message GetJobRequest {
  string job_id = 1;
  string tenant_id = 2;
}

message GetJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  string job_id = 1;
  string tenant_id = 15;
}

message CancelJobResponse {
  bool success = 1;
}

message RetryJobRequest {
  string job_id = 1;
  string tenant_id = 15;
}

message RetryJobResponse {
  string new_job_id = 1;
}

message GetJobEventsRequest {
  string job_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  google.protobuf.Timestamp before_ts = 4;
  int64 before_id = 5;
  string tenant_id = 15;
}

message GetJobEventsResponse {
  repeated JobEvent events = 1;
}

message GetJobSummaryRequest {
  google.protobuf.Timestamp start_time = 1 [deprecated = true];
  google.protobuf.Timestamp end_time = 2 [deprecated = true];
  string tenant_id = 15;
  AnalyticsQueryEnvelope query = 16;
}

message JobSummaryBucket {
  google.protobuf.Timestamp bucket_time = 1;
  int64 total_jobs = 2;
  int64 completed_jobs = 3;
  int64 failed_jobs = 4;
}

message GetJobSummaryResponse {
  repeated JobSummaryBucket summaries = 1;
}

message DatasetProfile {
  string profile_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp computed_at = 3;
  int64 record_count = 4;
  repeated FeatureProfile feature_profiles = 5;
}

message GetDatasetSummaryRequest {
  string profile_id = 1; // if empty, get latest?
  string tenant_id = 2;
}

message GetDatasetSummaryResponse {
  DatasetProfile profile = 1;
}


message ListDatasetProfilesResponse {
  repeated DatasetProfile profiles = 1;
  common.v1.CursorPageResponse pagination = 2;
}

message GetLatestDatasetProfileRequest {
  string tenant_id = 1;
}

message GetLatestDatasetProfileResponse {
  string profile_id = 1;
  google.protobuf.Timestamp computed_at = 2;
  int64 record_count = 3;
}

message CompareDatasetProfilesRequest {
  string baseline_profile_id = 1;
  string candidate_profile_id = 2;
  string tenant_id = 3;
}

message CompareDatasetProfilesResponse {
  string baseline_profile_id = 1;
  string candidate_profile_id = 2;
  repeated FeatureDrift drift = 3;
}

message FeatureDrift {
  string feature_name = 1;
  double psi = 2;
  string drift_severity = 3; // "none", "low", "high"
}

message TrainingRun {
  string run_id = 1;
  string model_name = 2;
  string status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  string metrics_json = 6;
  string params_json = 7;
  string dataset_id = 8;
  string mlflow_run_id = 9;
  string tenant_id = 10;
}

message ListTrainingRunsRequest {
  string model_name = 1;
  int32 limit = 2;
  int32 offset = 3;
  string status = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  string tenant_id = 15;
  common.v1.CursorPageRequest pagination = 16;
}

message ListTrainingRunsResponse {
  repeated TrainingRun runs = 1;
  common.v1.CursorPageResponse pagination = 2;
}

message ListModelVersionsRequest {
  string model_name = 1;
  int32 limit = 2;
  int32 offset = 3;
  string tenant_id = 15;
  common.v1.CursorPageRequest pagination = 16;
}

message ListModelVersionsResponse {
  repeated TrainingRun versions = 1; // lightweight summary using TrainingRun
  common.v1.CursorPageResponse pagination = 2;
}

message GetTrainingRunRequest {
  string run_id = 1;
  string tenant_id = 2;
}

message GetTrainingRunResponse {
  TrainingRun run = 1;
}

message MetricPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
  string run_id = 3;
}

message GetMetricSeriesRequest {
  string model_name = 1;
  string metric_name = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  string tenant_id = 15;
}

message GetMetricSeriesResponse {
  repeated MetricPoint points = 1;
}

message ReportTrainingRunRequest {
  TrainingRun run = 1;
  string tenant_id = 2;
}

message ReportTrainingRunResponse {
  bool success = 1;
}
