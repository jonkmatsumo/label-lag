[project]
name = "synthetic-data-gen"
version = "0.1.0"
description = "Synthetic data generation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faker>=28.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "typer>=0.12.0",
    "structlog>=24.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "mlflow>=3.8.0",
    "boto3>=1.34.0",
    "xgboost>=2.0.0",
    "optuna>=4.0.0",
    "optuna-integration[xgboost]",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "tenacity>=9.1.2",
    "prometheus-client>=0.20.0",
]

[project.scripts]
synthetic-data-gen = "main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src"]

[tool.ruff]
src = ["python/src"]
line-length = 88
exclude = [
    "python/src/inference_server/proto",  # legacy
    "python/src/training_server/proto",   # legacy
    "python/src/forecast/proto",          # legacy
    "python/src/gateway_grpc",            # legacy
    "python/src/**/v1",                   # generated protos
    "python/src/**/*_pb2.py",             # generated protos
    "python/src/**/*_pb2_grpc.py",        # generated protos
    "**/proto",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]
addopts = "--cov --cov-report=term-missing"
markers = [
    "slow: marks tests that are too heavy for CI (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["python/src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
omit = [
    "python/tests/*",
    "python/src/**/v1/*",
    "python/src/**/*_pb2.py",
    "python/src/**/*_pb2_grpc.py",
]

[dependency-groups]
dev = [
    "tenacity>=9.1.2",
]
