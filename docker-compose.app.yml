services:
  # Python Training/API Server
  # Python Training/API Server
  training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: training
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - PYTHONPATH=/app/src
      - PYTHONHASHSEED=42
      - TRAINING_SERVER_HOST=0.0.0.0
      - TRAINING_SERVER_PORT=50053
    networks:
      - labellag_net
    ports:
      - "${TRAINING_SERVER_PORT:-50053}:50053"
      - "8000:8000"
    command: [ "uv", "run", "python", "-m", "training.server" ]
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: go/analytics/Dockerfile
    container_name: analytics
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-synthetic}:${POSTGRES_PASSWORD:-synthetic_dev_password}@db:5432/${POSTGRES_DB:-synthetic_data}?sslmode=disable
      - PORT=50051
    networks:
      - labellag_net
    ports:
      - "${ANALYTICS_CRUD_PORT:-50051}:50051"
    depends_on:
      db:
        condition: service_healthy

  inference:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: inference
    environment:
      - INFERENCE_SERVER_HOST=0.0.0.0
      - INFERENCE_SERVER_PORT=50052
      - INFERENCE_SERVER_DB_DSN=postgresql://${POSTGRES_USER:-synthetic}:${POSTGRES_PASSWORD:-synthetic_dev_password}@db:5432/${POSTGRES_DB:-synthetic_data}
      - INFERENCE_SERVER_MLFLOW_TRACKING_URI=http://mlflow:5000
      - INFERENCE_SERVER_INCLUDE_FEATURES_USED=true
      - PYTHONPATH=/app/src
      - PYTHONHASHSEED=42
    networks:
      - labellag_net
    ports:
      - "${INFERENCE_SERVER_PORT:-50052}:50052"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: go/orchestrator/Dockerfile
    container_name: orchestrator
    environment:
      - PORT=8081
      - INFERENCE_GATEWAY_PYTHON_GRPC_ADDR=inference:50052
      - TRAINING_SERVER_GRPC_ADDR=training:50053
      - ANALYTICS_CRUD_TARGET=analytics:50051
      - INFERENCE_GATEWAY_RULES_PATH=go/orchestrator/config/default_rules.json
      - INFERENCE_GATEWAY_RULES_WATCH=true
    networks:
      - labellag_net
    ports:
      - "${INFERENCE_GATEWAY_PORT:-8081}:8081"
      - "${INFERENCE_GATEWAY_GRPC_PORT:-50505}:50505"
    depends_on:
      analytics:
        condition: service_started
      inference:
        condition: service_started

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synthetic-data-generator
    profiles: [ "tools" ]
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    networks:
      - labellag_net
    stdin_open: true
    tty: true

  # BFF (Backend for Frontend) - Node.js proxy layer for React UI
  bff:
    build:
      context: typescript/bff
      dockerfile: Dockerfile
    container_name: label-lag-bff
    profiles: [ "react", "all" ]
    environment:
      - BFF_PORT=${BFF_PORT:-3210}
      - BFF_HOST=0.0.0.0
      - BFF_PYTHON_API_BASE_URL=http://orchestrator:8081
      - BFF_MLFLOW_TRACKING_URI=http://mlflow:5000
      - BFF_GATEWAY_BASE_URL=http://orchestrator:8081
      - BFF_REQUEST_TIMEOUT=30000
      - BFF_LOG_LEVEL=info
      - NODE_ENV=production
    networks:
      - labellag_net
    ports:
      - "${BFF_PORT:-3210}:${BFF_PORT:-3210}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${BFF_PORT:-3210}/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      training:
        condition: service_healthy
      orchestrator:
        condition: service_started

  # React Web UI
  web:
    build:
      context: typescript/ui
      dockerfile: Dockerfile
    container_name: label-lag-web
    profiles: [ "react", "all" ]
    networks:
      - labellag_net
    ports:
      - "${WEB_PORT:-5180}:${WEB_PORT:-5180}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${WEB_PORT:-5180}/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      bff:
        condition: service_healthy

# Network labellag_net is defined in docker-compose.infra.yml.
# Run app with infra: -f docker-compose.infra.yml -f docker-compose.app.yml,
# or use the convenience wrapper (include). Do not run app compose alone.
