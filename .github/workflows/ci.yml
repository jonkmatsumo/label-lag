name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Protos
        run: make proto-gen-python

      - name: Run ruff linting
        run: uv run ruff check python/src python/tests

      - name: Run ruff formatting check
        run: uv run ruff format --check python/src python/tests

      - name: Run tests
        run: uv run pytest --cov=python/src/synthetic_pipeline --cov-report=xml

  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install BFF dependencies
        working-directory: typescript/bff
        run: npm ci

      - name: Test BFF
        working-directory: typescript/bff
        run: npm test

      - name: Install UI dependencies
        working-directory: typescript/ui
        run: npm ci

      - name: Lint UI
        working-directory: typescript/ui
        run: npm run lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate Protos
        run: make proto-gen-python

      - name: Run ruff
        run: uv run ruff check --output-format=github python/src python/tests

  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/orchestrator
          - go/analytics

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install Protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          curl -LO --retry 5 --retry-delay 5 $PB_REL/download/v23.4/protoc-23.4-linux-x86_64.zip
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-23.4-linux-x86_64.zip

      - name: Install Go Protoc Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Protos
        run: make proto-gen-go

      - name: Run Go tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          curl -LO --retry 5 --retry-delay 5 $PB_REL/download/v23.4/protoc-23.4-linux-x86_64.zip
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-23.4-linux-x86_64.zip

      - name: Generate Protos
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make proto-gen

      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=synthetic
          POSTGRES_PASSWORD=synthetic_dev_password
          POSTGRES_DB=synthetic_data
          EOF

      - name: Start stack
        run: make app-up

      - name: Wait for orchestrator health
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:8081/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "orchestrator health check timed out"
          exit 1

      - name: Run smoke test
        env:
          ORCHESTRATOR_BASE_URL: http://localhost:8081
          TENANT_ID: tenant-1
        run: make test-smoke

      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.infra.yml -f docker-compose.app.yml ps
          docker compose -f docker-compose.infra.yml -f docker-compose.app.yml logs --no-color

      - name: Tear down stack
        if: always()
        run: make app-down

  generate-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: synthetic_data
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Protoc
        run: |
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          curl -LO --retry 5 --retry-delay 5 $PB_REL/download/v23.4/protoc-23.4-linux-x86_64.zip
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local bin/protoc
          sudo unzip -o protoc-23.4-linux-x86_64.zip -d /usr/local 'include/*'
          rm -f protoc-23.4-linux-x86_64.zip

      - name: Generate Protos
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          make proto-gen

      - name: Start Analytics Service
        env:
          DATABASE_URL: postgresql://synthetic:synthetic_dev_password@localhost:5432/synthetic_data?sslmode=disable
          ENABLE_GO_DATASET_GENERATE: "true"
          GENERATOR_CONFIG_PATH: go/analytics/config/generator.yaml
        run: |
          cd go/analytics
          go run main.go &
          # Wait for service to start
          for i in {1..30}; do
            nc -z localhost 50051 && break
            sleep 1
          done

      - name: Run Generate Integration Test
        env:
          ANALYTICS_CRUD_TARGET: localhost:50051
        run: uv run pytest python/tests/integration/test_generate.py -v
